{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Admin setup</title>
</head>
<body>
    <div class="setup">
        <h2>Admin setup</h2>
        <p>Create the first admin account. This page will only be useable until the first account is created. Password must be at least 8 characters.</p>
        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="At least 8 characters" minlength="8" required>
            </div>
            <button type="submit" class="submitbutton">Create admin</button>
        </form>
    </div>
</body>
</html>
