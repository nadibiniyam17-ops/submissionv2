{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Add admin</title>
</head>
<body>
    <div class="setup">
        <a href="{% url 'submission_list' %}" class="back-link">←Back to dashboard</a>
        <h2>Add admin</h2>
        <p>Create another admin account that can review submissions. Password must be at least 8 characters.</p>

        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="alert-success">{{ success }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="At least 8 characters" minlength="8" required>
            </div>
            <div class="form-group">
                <label>Confirm password</label>
                <input type="password" name="confirm" placeholder="Confirm password" minlength="8" required>
            </div>
            <button type="submit" class="submitbutton">Create admin</button>
        </form>
    </div>
</body>
</html>
